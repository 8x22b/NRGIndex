name: Pipeline

# Единый пайплайн: запускается при мерже в production (push). Тесты в облаке GitHub
# и пре-деплой-тесты на боевом раннере идут параллельно, деплой — только после
# успешного завершения обоих. Ручной запуск идёт тем же путём, push в master молчит.
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  # Деплой не отменяем на полпути: второй мерж просто встанет в очередь.
  cancel-in-progress: false

jobs:
  # Тесты в чистом окружении GitHub + smoke-старт сервера.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and API tests
        run: npm test

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: "Smoke: сервер стартует и отвечает"
        run: |
          DB_PATH="$RUNNER_TEMP/nrg-ci.db" UPLOADS_DIR="$RUNNER_TEMP/nrg-ci-uploads" PORT=3210 \
            node server/index.js > /tmp/nrg-ci.log 2>&1 &
          server_pid=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3210/api/health > /dev/null; then ok=1; break; fi
            sleep 0.5
          done
          if [ -z "$ok" ]; then
            echo "Сервер не поднялся:"; cat /tmp/nrg-ci.log; kill "$server_pid" 2>/dev/null || true; exit 1
          fi
          curl -fsS http://127.0.0.1:3210/api/health | grep -q '"ok":true'
          curl -fsS -o /dev/null http://127.0.0.1:3210/
          curl -fsS -o /dev/null http://127.0.0.1:3210/cabinet.html
          kill "$server_pid"

  # Тот же коммит перепроверяем на боевом раннере: окружение деплоя бывает строже CI.
  pre-deploy:
    name: Pre-deploy tests
    runs-on: [self-hosted, nrgindex]
    steps:
      - uses: actions/checkout@v7

      # На боевом раннере Node уже стоит (/opt/node) — не тянем его заново
      # через setup-node (это стоило 40–60 секунд на джобу).
      - name: Системный Node 22
        run: |
          echo "/opt/node/bin" >> "$GITHUB_PATH"
          version="$(/opt/node/bin/node -p 'process.versions.node')"
          echo "node $version"
          case "$version" in 22.*) ;; *) echo "нужен Node 22, а стоит $version"; exit 1 ;; esac

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Unit and API tests
        run: npm test

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  # Деплой ждёт обе проверки: упал любой из тестов — деплоя нет.
  deploy:
    name: Deploy to LXC
    needs: [test, pre-deploy]
    runs-on: [self-hosted, nrgindex]
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      # Node с раннера, без скачивания через setup-node.
      - name: Системный Node 22
        run: |
          echo "/opt/node/bin" >> "$GITHUB_PATH"
          version="$(/opt/node/bin/node -p 'process.versions.node')"
          echo "node $version"
          case "$version" in 22.*) ;; *) echo "нужен Node 22, а стоит $version"; exit 1 ;; esac

      - name: Install production dependencies
        run: npm ci --omit=dev --prefer-offline

      - name: "Dry-run: синтаксис и миграции на временной БД"
        run: |
          set -euo pipefail
          node --check server/index.js
          CHECK_DB="$(mktemp -u /tmp/nrgindex-check.XXXXXX.db)"
          DB_PATH="$CHECK_DB" node -e "
            const { openDatabase } = require('./server/db');
            const db = openDatabase(process.env.DB_PATH);
            const tables = db.prepare(\"SELECT COUNT(*) AS n FROM sqlite_master WHERE type = 'table'\").get().n;
            if (tables < 8) throw new Error('мало таблиц: ' + tables);
            console.log('dry-run ok, tables:', tables);
            db.close();
          "
          rm -f "$CHECK_DB" "$CHECK_DB-wal" "$CHECK_DB-shm"

      - name: Backup and sync app to /opt/nrgindex
        run: |
          set -euo pipefail
          LIVE=/opt/nrgindex
          BACKUP=/home/ghrunner/backups/nrgindex-app
          rm -rf "$BACKUP"
          mkdir -p "$BACKUP"
          if [ -d "$LIVE" ]; then cp -a "$LIVE" "$BACKUP"; fi
          mkdir -p "$LIVE"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tests/' \
            --exclude '.env*' \
            --exclude '*.log' \
            ./ "$LIVE/"

      - name: Restart and health check (with rollback)
        run: |
          set -euo pipefail
          HEALTH_URL="${HEALTH_URL:-http://127.0.0.1/api/health}"
          LIVE=/opt/nrgindex
          BACKUP=/home/ghrunner/backups/nrgindex-app
          sudo systemctl restart nrgindex
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS "$HEALTH_URL" > /dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "Health check не прошёл — откат"
            sudo systemctl status nrgindex --no-pager || true
            if [ -d "$BACKUP" ]; then
              rsync -a --delete "$BACKUP/" "$LIVE/"
              sudo systemctl restart nrgindex
              echo "Откат выполнен"
            fi
            exit 1
          fi
          curl -fsS "$HEALTH_URL"
          echo "Деплой и health check успешны"
