name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    name: Test site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Syntax check (node --check)
        run: |
          for f in *.js scripts/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Site data and assets check
        run: node scripts/check-site.js

      - name: Build config smoke test
        env:
          LOGIN_KEYS_JSON: '[{"key":"ci-test","hash":"ci-test-hash","pid":"sanya"}]'
          OPENROUTER_KEY: ""
          OPENROUTER_MODEL: openai/gpt-4o-mini
        run: |
          node scripts/build-config.js
          test -s keys.js
          node --check keys.js
          rm -f keys.js
