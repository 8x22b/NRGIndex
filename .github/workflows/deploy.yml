name: Deploy to LXC

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy site
    runs-on: [self-hosted, nrgindex]
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build keys.js from secrets
        run: node scripts/build-config.js
        env:
          LOGIN_KEYS_JSON: ${{ secrets.LOGIN_KEYS_JSON }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}

      - name: Sync site to /var/www/nrgindex
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'scripts/' \
            --exclude 'tools/' \
            --exclude 'assets_original_backup/' \
            --exclude 'node_modules/' \
            --exclude '.env*' \
            ./ /var/www/nrgindex/

      - name: Reload lighttpd
        run: sudo systemctl reload lighttpd
